name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    name: Validate plugin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Setup Node.js (for markdownlint)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python (for frontmatter validation)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Plugin structure validation
        run: scripts/validate-plugin.sh

      - name: Frontmatter validation
        run: python scripts/validate-frontmatter.py

      - name: Markdown lint
        run: npx markdownlint-cli2 "horse/**/*.md" "docs/**/*.md"

      - name: Shell lint
        run: shellcheck horse/scripts/*.sh scripts/*.sh
