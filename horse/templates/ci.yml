# ci.yml — GitHub Actions CI workflow template with readiness gates
# Generated by the horse plugin. Adjust paths, versions, and thresholds to fit your project.
# See ADR-0007 for the five-gate readiness policy.
#
# Usage: copy this file to .github/workflows/ci.yml in your project.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # GATE 2: Ready for Commit — unit tests + lint + type check
  # ════════════════════════════════════════════════════════════════════════════

  # ── Python: Gate 2 ─────────────────────────────────────────────────────────
  gate-commit-python:
    name: "Gate 2: Commit (Python)"
    runs-on: ubuntu-latest
    if: hashFiles('pyproject.toml') != '' || hashFiles('requirements.txt') != ''

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type check (mypy)
        run: .venv/bin/mypy src/

      - name: Unit tests
        run: |
          .venv/bin/pytest tests/unit/ \
            --cov=src \
            --cov-report=term-missing \
            -x --tb=short -v

  # ── TypeScript: Gate 2 ─────────────────────────────────────────────────────
  gate-commit-typescript:
    name: "Gate 2: Commit (TypeScript)"
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''

    strategy:
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint src/

      - name: Format check (prettier)
        run: npx prettier --check src/ tests/

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run tests/unit

  # ════════════════════════════════════════════════════════════════════════════
  # GATE 3: Ready for Push — full test suite (integration + e2e)
  # ════════════════════════════════════════════════════════════════════════════

  # ── Python: Gate 3 ─────────────────────────────────────────────────────────
  gate-push-python:
    name: "Gate 3: Push (Python)"
    needs: gate-commit-python
    runs-on: ubuntu-latest
    if: hashFiles('pyproject.toml') != '' || hashFiles('requirements.txt') != ''

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Full test suite with coverage
        run: |
          .venv/bin/pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -x --tb=short -v

      - name: Security audit
        run: .venv/bin/pip audit

  # ── TypeScript: Gate 3 ─────────────────────────────────────────────────────
  gate-push-typescript:
    name: "Gate 3: Push (TypeScript)"
    needs: gate-commit-typescript
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''

    strategy:
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Full test suite with coverage
        run: npx vitest run --coverage

      - name: Security audit
        run: npm audit --audit-level=moderate

  # ════════════════════════════════════════════════════════════════════════════
  # GATE 4: Ready for Review — doc-sync + markdown lint + structure validation
  # ════════════════════════════════════════════════════════════════════════════
  gate-review:
    name: "Gate 4: Review"
    needs: [gate-push-python, gate-push-typescript]
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Markdown lint
        run: npx markdownlint-cli2 "**/*.md" --ignore node_modules

      - name: Plugin structure validation
        if: hashFiles('horse/.claude-plugin/plugin.json') != '' || hashFiles('.claude-plugin/plugin.json') != ''
        run: |
          if [[ -f scripts/validate-plugin.sh ]]; then
            bash scripts/validate-plugin.sh
          fi

      - name: Doc-sync check
        if: hashFiles('docs/requirements/requirements_doc.md') != ''
        run: |
          if [[ -f horse/scripts/doc_sync_check.sh ]]; then
            bash horse/scripts/doc_sync_check.sh
          fi
