# ci.yml — GitHub Actions CI workflow template
# Generated by the horse plugin. Adjust paths, versions, and thresholds to fit your project.
#
# Usage: copy this file to .github/workflows/ci.yml in your project.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Python CI ─────────────────────────────────────────────────────────────
  python:
    name: Python CI
    runs-on: ubuntu-latest
    # Only run if this is a Python project (pyproject.toml or requirements.txt exists)
    if: hashFiles('pyproject.toml') != '' || hashFiles('requirements.txt') != ''

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Type check (mypy)
        run: .venv/bin/mypy src/

      - name: Test with coverage
        run: |
          .venv/bin/pytest tests/ \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            -x --tb=short -v

      - name: Security audit
        run: .venv/bin/pip audit

  # ── TypeScript CI ─────────────────────────────────────────────────────────
  typescript:
    name: TypeScript CI
    runs-on: ubuntu-latest
    # Only run if this is a TypeScript project (package.json exists)
    if: hashFiles('package.json') != ''

    strategy:
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npx eslint src/

      - name: Format check (prettier)
        run: npx prettier --check src/ tests/

      - name: Type check (tsc)
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npx vitest run --coverage

      - name: Security audit
        run: npm audit --audit-level=moderate
